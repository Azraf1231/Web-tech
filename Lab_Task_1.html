<!DOCTYPE html>
<html>
<head>
    <title>Campus Club Membership</title>
    <style>
        h1{text-align: center;
            color:brown;` 
            ;
        }
        .topnav{

            background-color: black;
            position:sticky;
            top: 0;
            overflow: hidden;
        }

        .topnav a{
            float: left;
            color: white;
            padding: 14px 16px;
        }

        .topnav a  :hover{
            background-color: violet;
        }

        .card{

            width: 400px;
            margin: auto;
            padding: 15px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: white;
            box-shadow: 4px 4px 8px gray;
            position: relative;

        }

        .card >h2{
            color: green;
            margin-top: 0;

        }


        .card p
        {
            font-style: italic;
        }


        .badge{

            position:absolute ;
            top: 10px; ;
            right: 10px;
            background:red ;
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;



        }

        input[type="text"],input[type="email"],input[type="text"],select,textarea{
            width: 100%;
            margin-bottom: 10px;
            padding: 5px ;
            box-sizing:border-box ;
        }
    </style>
</head>
<body>

<h1>Programming Club</h1>

 <div class="topnav">
        <a href="#">Home</a>
        <a href="#">Events</a>
        <a href="#">Join</a>
 </div>
    <div class="card">
        <span class="badge">NEW</span>
        <h2>Join Us</h2>
        <p>Please fill out the form below.</p>

        <form action="#" method="post">
            <fieldset>
             <legend>Join the Club</legend>

         <label for="name">Full Name:</label>
             <input type="text" id="name" name="fullname" minlength="3" required>

             <label for="email">Email:</label>
             <input type="email" id="email" name="email" required>

             <label for="sid">Student ID:</label>
             <input type="text" id="sid" name="studentid" placeholder="24-58292-2" pattern="[0-9{2}-[0-9]{5}-[0-9]{1}" required>

             <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="17" max="40" required>

            <label>Membership Type:</label><br>
            <input type="radio" id="gen" name="type" value="General" required>
             <label for="gen">General</label>
             <input type="radio" id="exec" name="type" value="Executive" required>
             <label for="exec">Executive</label><br><br>

             <label for="club">Preferred Club:</label>
            <select id="club" name="club" required>
                <option value="">Select a club</option>
             <option value="Programming">Programming</option>
            <option value="Robotics">Robotics</option>
            <option value="Debate">Debate</option>
            </select>

             <label for="reason">Why do you want to join?:</label>
            <textarea id="reason" name="reason" maxlength="200" required></textarea>

<input type="checkbox" id="rules" name="rules" required>
 <label for="rules">I agree to the club rules</label><br><br>

 <input type="submit" value="Join Now">
</fieldset>
  </form>
 </div>

</body>
</html>
