<!DOCTYPE html>
<html>
<head>
    <title>Blood Donor Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }
        h2{
   
            text-align: center;
            color: #800000;
        }
       
        form {
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            width: 480px;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"], input[type="password"], select {
            width: 250px;
            padding: 5px;
        }
        .error {
            color: red;
            font-size: 12px;
            display: block;
            margin-top: 3px;
            margin-left: 154px;
        }
        table {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            border-collapse: collapse;
            background: #fff;
            
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            padding: 5px 10px;
            background-color: #b30000;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #800000;
        }
    </style>
</head>
<body>

    <h2>Blood Donor Registration</h2>

    <form onsubmit="return validateForm();" novalidate>
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" minlength="3" pattern="[A-Za-z\s]+" required>
            <span id="err-name" class="error"></span>
        </div>

        <div class="form-group">
            <label for="id">AIUB ID:</label>
            <input type="text" id="id" pattern="[0-9]{2}-[0-9]{5}-[0-9]{1}" required placeholder="XX-XXXXX-X">
            <span id="err-id" class="error"></span>
        </div>

        <div class="form-group">
            <label for="phone">Mobile:</label>
            <input type="text" id="phone" pattern="[0-9]{11}" required placeholder="11 digits">
            <span id="err-phone" class="error"></span>
        </div>

        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" min="18" max="65" required>
            <span id="err-age" class="error"></span>
        </div>

        <div class="form-group">
            <label for="bgroup">Blood Group:</label>
            <select id="bgroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
            <span id="err-bgroup" class="error"></span>
        </div>

        <div class="form-group">
            <label>Donate blood?:</label>
            <input type="radio" id="donateyes" name="donateset" value="Yes"> Yes
            <input type="radio" id="donateno" name="donateset" value="No"> No
            <span id="err-donateset" class="error"></span>
        </div>

        <div class="form-group">
            <label for="agree">Confirmation:</label>
            <input type="checkbox" id="agree"> I am healthy and willing to donate
            <span id="err-agree" class="error"></span>
        </div>

        <div class="form-group">
            <label for="pass1">Password:</label>
            <input type="password" id="pass1" minlength="6" required>
            <span id="err-pass1" class="error"></span>
        </div>

        <div class="form-group">
            <label for="pass2">Confirm Password:</label>
            <input type="password" id="pass2" required>
            <span id="err-pass2" class="error"></span>
        </div>

        <div class="form-group">
            <label></label>
            <button type="submit">Register!</button>
        </div>
    </form>

    <p id="count">Total donors: 0</p>

    <h3>List</h3>
    <table>
        <thead>
            <tr>
                <th>Status / Name</th>
                <th>ID</th>
                <th>Blood Group</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="donorBody">
        </tbody>
    </table>

    <script>
        let donors = [];

        function validateForm() {
            let isValid = true;

            document.getElementById("err-name").textContent = "";
            document.getElementById("err-id").textContent = "";
            document.getElementById("err-phone").textContent = "";
            document.getElementById("err-age").textContent = "";
            document.getElementById("err-bgroup").textContent = "";
            document.getElementById("err-donateset").textContent = "";
            document.getElementById("err-agree").textContent = "";
            document.getElementById("err-pass1").textContent = "";
            document.getElementById("err-pass2").textContent = "";

            let name = document.getElementById("name").value.trim();
            let namePattern = /^[A-Za-z\s]+$/;
            if (name === "") {
                document.getElementById("err-name").textContent = "* Name";
                isValid = false;
            } else if (name.length < 3) {
                document.getElementById("err-name").textContent = "* Name";
                isValid = false;
            } else if (!namePattern.test(name)) {
                document.getElementById("err-name").textContent = "* Name";
                isValid = false;
            }

            let id = document.getElementById("id").value.trim();
            let idPattern = /^[0-9]{2}-[0-9]{5}-[0-9]{1}$/;
            if (id === "") {
                document.getElementById("err-id").textContent = "* ID";
                isValid = false;
            } else if (!idPattern.test(id)) {
                document.getElementById("err-id").textContent = "* ID";
                isValid = false;
            }

            let phone = document.getElementById("phone").value.trim();
            let phonePattern = /^[0-9]{11}$/;
            if (phone === "") {
                document.getElementById("err-phone").textContent = "* phone";
                isValid = false;
            } else if (!phonePattern.test(phone)) {
                document.getElementById("err-phone").textContent = "* phone";
                isValid = false;
            }

            let ageVal = document.getElementById("age").value;
            let age = Number(ageVal);
            if (ageVal === "" || isNaN(age)) {
                document.getElementById("err-age").textContent = "* age";
                isValid = false;
            } else if (age < 18 || age > 65) {
                document.getElementById("err-age").textContent = "* age";
                isValid = false;
            }

            let bgroup = document.getElementById("bgroup").value;
            if (bgroup === "") {
                document.getElementById("err-bgroup").textContent = "* bgroup";
                isValid = false;
            }

            let donateYes = document.getElementById("donateyes").checked;
            let donateNo = document.getElementById("donateno").checked;
            if (!donateYes && !donateNo) {
                document.getElementById("err-donateset").textContent = "* checed";
                isValid = false;
            }

            let agree = document.getElementById("agree").checked;
            if (!agree) {
                document.getElementById("err-agree").textContent = "* agree";
                isValid = false;
            }

            let pass1 = document.getElementById("pass1").value;
            if (pass1 === "") {
                document.getElementById("err-pass1").textContent = "* pass1";
                isValid = false;
            } else if (pass1.length < 6) {
                document.getElementById("err-pass1").textContent = "* pass1";
                isValid = false;
            }

            let pass2 = document.getElementById("pass2").value;
            if (pass2 === "") {
                document.getElementById("err-pass2").textContent = "* pass2";
                isValid = false;
            } else if (pass2 !== pass1) {
                document.getElementById("err-pass2").textContent = "* pass2";
                isValid = false;
            }

            if (isValid) {
                let donorObj = {
                    name: name,
                    id: id,
                    bgroup: bgroup
                };
                donors.push(donorObj);
                renderTable();
                document.querySelector("form").reset();
            }

            return false;
        }

        function renderTable() {
            let tbody = document.getElementById("donorBody");
            tbody.innerHTML = "";

            for (let i = 0; i < donors.length; i++) {
                let d = donors[i];
                let row = document.createElement("tr");

                let tdName = document.createElement("td");
                tdName.textContent = d.name;
                row.appendChild(tdName);

                let tdId = document.createElement("td");
                tdId.textContent = d.id;
                row.appendChild(tdId);

                let tdGroup = document.createElement("td");
                tdGroup.textContent = d.bgroup;
                row.appendChild(tdGroup);

                let tdAction = document.createElement("td");
                let btn = document.createElement("button");
                btn.textContent = "Remove";
                let index = i;
                btn.onclick = function() {
                    removeDonor(index);
                };
                tdAction.appendChild(btn);
                row.appendChild(tdAction);

                tbody.appendChild(row);
            }

            document.getElementById("count").textContent = "Total donors: " + donors.length;
        }

        function removeDonor(index) {
            donors.splice(index, 1);
            renderTable();
        }
    </script>
</body>
</html>
